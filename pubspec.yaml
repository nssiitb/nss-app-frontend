name: nssapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.0.0
  image_picker: ^0.8.7+4
  http:
  shared_preferences:
  url_launcher:
  table_calendar: ^3.2.0
  intl: ^0.20.2
  geolocator: ^14.0.2 
  device_info_plus: ^10.0.0
  uuid: ^4.3.1
  flutter_launcher_icons: "^0.13.1"
  google_fonts: ^6.2.1
  pdf: ^3.10.0
  printing: ^5.11.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/launcher_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/launcher_logo.png"




fonts:
  - family: Quicksand
    fonts:
      - asset: assets/fonts/Raleway-VariableFont_wght.ttf
        weight: 400
      - asset: assets/fonts/Mulish-VariableFont_wght.ttf
        weight: 400

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/